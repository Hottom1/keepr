[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[dev]
  command = "npm run dev"
  targetPort = 5173
  port = 8888
  autoLaunch = false

# Response headers (security audit H1).
# The CSP was exercised in Report-Only mode against the real production app
# (page load, every tab, the YouTube player, Supabase storage upload / signed
# URL / image load, Kip chat, the lazy Excel library) with no violations before
# being enforced. What the app legitimately loads: its own bundle, the YouTube
# IFrame API and player, Supabase (REST, auth, storage, signed image/video
# URLs) and blob:/data: for video frames. Inline styles are needed (React style
# attributes and a few <style> tags). If a new third-party origin is ever added
# (fonts, analytics, another embed) it must be added here or it will be blocked.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://www.youtube.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; media-src 'self' blob: https:; font-src 'self' data:; connect-src 'self' https://*.supabase.co wss://*.supabase.co; frame-src https://www.youtube.com https://www.youtube-nocookie.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
